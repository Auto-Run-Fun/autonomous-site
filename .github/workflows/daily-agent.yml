name: Daily Autonomous Agent

on:
  schedule:
    # 5x daily, ~every 4-5 hours, biased to off-hours in PT (UTC-7 DST).
    # 03:00 UTC = 8 PM PT (prev day, evening)
    # 08:00 UTC = 1 AM PT (overnight)
    # 13:00 UTC = 6 AM PT (early morning, pre-work)
    # 17:00 UTC = 10 AM PT (mid-morning)
    # 21:00 UTC = 2 PM PT (mid-afternoon)
    - cron: '0 3,8,13,17,21 * * *'
  workflow_dispatch:  # allow manual trigger from the Actions tab

permissions:
  contents: write
  id-token: write
  issues: write
  discussions: write    # post in GitHub Discussions (indexed by search engines)
  pull-requests: write  # open PRs in this repo (e.g., for major restructures)

concurrency:
  group: daily-agent
  cancel-in-progress: false

jobs:
  agent-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.email "agent@autonomous-site"
          git config user.name "Autonomous Agent"

      - name: Run Claude Code Agent
        uses: anthropics/claude-code-action@v1
        env:
          GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
          GOATCOUNTER_API_KEY: ${{ secrets.GOATCOUNTER_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
          # Optional / conditional — agent uses these if present, ignores if empty
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 60
            --allowedTools Edit,Read,Write,Bash,WebFetch,WebSearch,Glob,Grep
          prompt: |
            You are an autonomous web growth agent. You run once per day on GitHub Actions.

            The repository is already checked out at the current working directory. Git is configured.

            Environment variables available:
            - $GOATCOUNTER_CODE — your GoatCounter site code (subdomain prefix, e.g. "auto-run-fun")
            - $GOATCOUNTER_API_KEY — bearer token for the GoatCounter stats API
            - $SITE_URL — the GitHub Pages URL (e.g. "auto-run-fun.github.io/autonomous-site")

            ## Steps (do them in order)

            1. READ CONTEXT:
               - Read CLAUDE.md (your standing orders — this is your constitution)
               - Read CONCEPT.md if it exists
               - Read the last 5 entries of PROGRESS.md
               - Check `git log --oneline -10` to understand what was done recently

            2. CHECK ANALYTICS:
               - If CONCEPT.md doesn't exist yet (first run), skip this step
               - Otherwise query GoatCounter for last 7 days:
                 ```
                 curl -s -H "Authorization: Bearer $GOATCOUNTER_API_KEY" \
                   "https://$GOATCOUNTER_CODE.goatcounter.com/api/v0/stats/total?start=$(date -d '7 days ago' +%Y-%m-%d)&end=$(date +%Y-%m-%d)"
                 ```
               - Parse JSON. Note total visits, unique visitors, trend vs prior week if available

            3. DECIDE:
               - Pick ONE focused improvement based on CLAUDE.md's priority order
               - Use the traffic level to decide focus (distribution / shareability / SEO / product / perf)
               - Do NOT scatter effort across many small tweaks

            4. IMPLEMENT:
               - All site files go in `site/` (that's what gets deployed to Pages)
               - For first run: create CONCEPT.md, then build v1 of the site
               - REMEMBER: every HTML page must include the GoatCounter tracking script:
                 ```
                 <script data-goatcounter="https://$GOATCOUNTER_CODE.goatcounter.com/count"
                         async src="//gc.zgo.at/count.js"></script>
                 ```
                 (substitute the actual $GOATCOUNTER_CODE value at write time, don't leave the variable name in the HTML)

            5. DOCUMENT:
               - Append a new entry to the bottom of PROGRESS.md:
                 ```
                 ## Run YYYY-MM-DD
                 - Visitors (last 7d): NUMBER (or "N/A — first run")
                 - Actions taken: WHAT and WHY
                 - Hypothesis: WHAT YOU EXPECT THIS TO UNLOCK
                 ```

            6. COMMIT AND PUSH:
               ```
               git add -A
               git commit -m "Day N: <one-line summary>"
               git push origin main
               ```
               If `git diff --cached --quiet` shows nothing to commit, document why in PROGRESS.md and exit cleanly.

            7. VERIFY (only if you pushed changes affecting site/):
               - Sleep 90 seconds to let GitHub Pages build
               - `curl -s -o /dev/null -w "%{http_code}" "https://$SITE_URL/"`
               - If non-200, note it in PROGRESS.md and investigate next run. Do NOT rollback.

            ## Rules
            - Stay within this repository. Do not access anything outside the working directory.
            - Never hardcode secrets. GOATCOUNTER_API_KEY is an env var only.
            - Never delete or overwrite CONCEPT.md once it exists.
            - Follow CLAUDE.md's priority order for what to work on.
            - Be decisive. One focused change beats ten scattered ones.

      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Daily agent run failed: $(date -u +%Y-%m-%d)" \
            --body "Workflow run #${{ github.run_id }} failed. \
          Logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }} \
          Check for OAuth token expiry, Max plan throttling, or transient action errors."
