<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 1200px; height: 630px;
    background: #0b0b10;
    color: #e9e9f1;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    position: relative;
    overflow: hidden;
  }
  /* subtle background glow */
  body::before {
    content: "";
    position: absolute;
    top: -160px; right: -160px;
    width: 540px; height: 540px;
    background: radial-gradient(circle, rgba(255,209,102,0.18) 0%, rgba(255,209,102,0) 65%);
    pointer-events: none;
  }
  body::after {
    content: "";
    position: absolute;
    bottom: -180px; left: -120px;
    width: 460px; height: 460px;
    background: radial-gradient(circle, rgba(239,71,111,0.14) 0%, rgba(239,71,111,0) 65%);
    pointer-events: none;
  }
  .frame {
    position: absolute;
    inset: 56px;
    border: 1px solid #2a2a36;
    border-radius: 24px;
    padding: 56px 64px;
    background: linear-gradient(180deg, rgba(21,21,29,0.6) 0%, rgba(21,21,29,0.2) 100%);
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .topline {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 20px;
    color: #8a8a9a;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: #ffd166;
    box-shadow: 0 0 18px #ffd166;
  }
  h1 {
    font-size: 108px;
    line-height: 0.98;
    margin: 0;
    letter-spacing: -0.035em;
    font-weight: 800;
  }
  h1 .accent { color: #ffd166; }
  .sub {
    margin-top: 28px;
    font-size: 32px;
    color: #c8c8d4;
    line-height: 1.3;
    max-width: 920px;
    letter-spacing: -0.005em;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
  }
  .chips {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .chip {
    background: #1c1c26;
    border: 1px solid #2a2a36;
    color: #e9e9f1;
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 20px;
  }
  .chip b { color: #8a8a9a; font-weight: 500; margin-right: 6px; }
  .url {
    font-size: 22px;
    color: #8a8a9a;
    letter-spacing: 0.01em;
  }
  .url b { color: #ffd166; font-weight: 600; }
</style></head>
<body>
  <div class="frame">
    <div>
      <div class="topline"><span class="dot"></span>Ship This Weekend</div>
    </div>
    <div>
      <h1>Ship <span class="accent">this</span><br>weekend.</h1>
      <p class="sub">A weekend-sized side project idea for developers — generated on click, with a stack, a time estimate, and a vibe.</p>
    </div>
    <div class="row">
      <div class="chips">
        <span class="chip"><b>Stack</b>Vanilla JS + localStorage</span>
        <span class="chip"><b>Time</b>one full weekend</span>
      </div>
      <div class="url"><b>↗</b> auto-run-fun.github.io/autonomous-site</div>
    </div>
  </div>
</body></html>
